<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>VaultCRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" type="image/svg+xml" href="img/vault-logo.svg">
<link rel="stylesheet" href="app.css">
<!-- Fonts load without blocking the first paint; system fonts show until they arrive -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'">
<link rel="preload" as="script" href="local-engine.js">
<link rel="preload" as="script" href="app.js">
<script>
  // Apply saved theme before paint to avoid a flash
  try {
    var t = JSON.parse(localStorage.getItem('vault_settings') || '{}').theme;
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (_) {}
</script>
</head>
<body>
<div class="bg" id="bg" aria-hidden="true"></div>
<div class="app">
  <aside class="rail" id="rail" aria-label="Main navigation">
    <div class="brand">
      <img class="brand-mark" src="img/vault-logo.svg" width="38" height="38" alt="">
      <div class="brand-text">
        <span class="brand-name">VAULT<small>CRM</small></span>
        <span class="brand-ws" id="wsName">Workspace</span>
      </div>
      <button class="icon-btn rail-close" id="railClose" aria-label="Close menu"></button>
    </div>
    <nav id="nav"></nav>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu"></button>
      <div class="crumbs" id="crumbs"></div>
      <div class="topbar-right">
        <span class="mode-pill" id="modePill"></span>
        <button class="icon-btn" id="themeBtn" aria-label="Switch theme"></button>
        <button class="icon-btn" id="settingsBtn" aria-label="Settings"></button>
      </div>
    </header>
    <main class="view" id="view" tabindex="-1">
      <div class="skeleton" aria-label="Loading">
        <div class="sk sk-title"></div>
        <div class="sk-row"><div class="sk sk-tile"></div><div class="sk sk-tile"></div><div class="sk sk-tile"></div><div class="sk sk-tile"></div></div>
        <div class="sk sk-panel"></div>
      </div>
    </main>
  </div>

  <nav class="bottombar" id="bottombar" aria-label="Quick navigation"></nav>
</div>

<div class="drawer-wrap" id="drawerWrap" hidden>
  <div class="drawer-scrim" data-close></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"></aside>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="local-engine.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
