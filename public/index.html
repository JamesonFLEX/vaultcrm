<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1117">
<title>VaultCRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<script>
  // Apply saved theme before paint to avoid a flash
  try {
    var t = JSON.parse(localStorage.getItem('vault_settings') || '{}').theme;
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (_) {}
</script>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail" aria-label="Main navigation">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" rx="9" class="bm-bg"/>
        <path d="M7 16h2.5M11 11v10M14.5 7v18M18 12v8M21.5 9v14M25 16h0" class="bm-wave"/>
      </svg>
      <div class="brand-text">
        <span class="brand-name">VaultCRM</span>
        <span class="brand-ws" id="wsName">Workspace</span>
      </div>
      <button class="icon-btn rail-close" id="railClose" aria-label="Close menu"></button>
    </div>
    <nav id="nav"></nav>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu"></button>
      <div class="crumbs" id="crumbs"></div>
      <div class="topbar-right">
        <span class="mode-pill" id="modePill"></span>
        <button class="icon-btn" id="themeBtn" aria-label="Switch theme"></button>
        <button class="icon-btn" id="settingsBtn" aria-label="Settings"></button>
      </div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>

  <nav class="bottombar" id="bottombar" aria-label="Quick navigation"></nav>
</div>

<div class="drawer-wrap" id="drawerWrap" hidden>
  <div class="drawer-scrim" data-close></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"></aside>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="local-engine.js"></script>
<script src="app.js"></script>
</body>
</html>
