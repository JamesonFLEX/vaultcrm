<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VaultCRM</title>
<script>
  // /vaultcrm/?fresh=1 clears the app's offline copy (it lives under /public/, outside this page)
  // so the newest version always loads. Saved data is not touched.
  (async function () {
    var q = new URLSearchParams(location.search);
    if (q.has('fresh')) {
      try { var regs = await navigator.serviceWorker.getRegistrations(); for (var r of regs) await r.unregister(); } catch (e) {}
      try { var keys = await caches.keys(); for (var k of keys) await caches.delete(k); } catch (e) {}
      q.delete('fresh'); q.set('r', Date.now());
    }
    var s = q.toString();
    location.replace('public/' + (s ? '?' + s : '') + location.hash);
  })();
</script>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#030916; color:#fff;
         font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color:#fcd34d; }
</style>
</head>
<body>
  <p>Opening VaultCRM… <a href="public/">Click here</a> if it doesn't load.</p>
</body>
</html>
